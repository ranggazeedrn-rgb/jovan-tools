        <div class="space-y-6">
          
          <!-- Admin Header Bar -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/[0.08] pb-5">
            <div class="space-y-1">
              <div class="flex items-center gap-2.5">
                <div class="p-2 rounded-xl bg-amber-500/15 text-amber-300 border border-amber-500/30">
                  <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <div>
                  <h2 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                    <span>Dashboard Administrator & API Vault</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">SYSTEM CONTROL</span>
                  </h2>
                  <p class="text-xs text-gray-400 font-mono">Kelola Kunci API, Validasi Koneksi Realtime, dan Pantau Telemetri Sistem</p>
                </div>
              </div>
            </div>

            <!-- Quick Action Controls -->
            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="syncVaultWithFirestore()" class="px-3.5 py-2 glass-panel text-cyan-300 hover:text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 transition hover:border-cyan-500/40">
                <i data-lucide="cloud-sync" class="w-4 h-4"></i>
                <span>Cloud Sync</span>
              </button>
              <button onclick="exportApiVaultJson()" class="px-3.5 py-2 glass-panel text-gray-300 hover:text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 transition">
                <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
                <span>Ekspor Backup</span>
              </button>
              <label class="px-3.5 py-2 glass-panel text-gray-300 hover:text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 cursor-pointer transition">
                <i data-lucide="upload" class="w-4 h-4 text-sky-400"></i>
                <span>Impor Backup</span>
                <input type="file" accept=".json" onchange="importApiVaultJson(event)" class="hidden" />
              </label>
            </div>
          </div>

          <!-- Telemetry Bento Grid (4 Cards) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- 1. Server Status & Uptime -->
            <div class="p-4 rounded-2xl bg-space-900/80 border border-white/[0.08] relative overflow-hidden group">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-400 font-mono">SERVER STATUS</span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              </div>
              <div class="text-xl font-extrabold text-white flex items-center gap-2" id="stat-server-status">
                <span>Operational</span>
              </div>
              <p class="text-[11px] text-gray-400 mt-1 font-mono" id="stat-server-uptime">
                Uptime: Memuat... · Node.js
              </p>
            </div>

            <!-- 2. Active API Keys Counter -->
            <div class="p-4 rounded-2xl bg-space-900/80 border border-white/[0.08] relative overflow-hidden group">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-400 font-mono">API VAULT KEYS</span>
                <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
              </div>
              <div class="text-xl font-extrabold text-white flex items-center gap-2">
                <span>${activeKeyCount}</span>
                <span class="text-xs font-normal text-gray-400">/ ${keys.length} Terpasang</span>
              </div>
              <p class="text-[11px] text-emerald-400 mt-1 font-mono flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ${activeKeyCount} Kunci Aktif
              </p>
            </div>

            <!-- 3. AI Engine Status -->
            <div class="p-4 rounded-2xl bg-space-900/80 border border-white/[0.08] relative overflow-hidden group">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-400 font-mono">AI INTELLIGENCE</span>
                <i data-lucide="bot" class="w-4 h-4 text-cyan-400"></i>
              </div>
              <div class="text-xl font-extrabold text-white flex items-center gap-1.5">
                <span>Gemini 3.5</span>
              </div>
              <p class="text-[11px] ${customGeminiActive ? 'text-cyan-300' : 'text-gray-400'} mt-1 font-mono">
                ${customGeminiActive ? '⚡ Custom Key Active' : '⚙️ Server Env Default'}
              </p>
            </div>

            <!-- 4. Cloud Database & User Sync -->
            <div class="p-4 rounded-2xl bg-space-900/80 border border-white/[0.08] relative overflow-hidden group">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-400 font-mono">DATABASE & AUTH</span>
                <i data-lucide="database" class="w-4 h-4 text-blue-400"></i>
              </div>
              <div class="text-xl font-extrabold text-white flex items-center gap-2">
                <span>Firestore DB</span>
              </div>
              <p class="text-[11px] ${window.currentUser ? 'text-emerald-400' : 'text-gray-400'} mt-1 font-mono truncate">
                ${window.currentUser ? '👤 ' + (window.currentUser.displayName || 'User Connected') : '⚪ Tamu (Lokal Saja)'}
              </p>
            </div>

          </div>

          <!-- Section: Form Tambah Kunci API Baru -->
          <div class="glass-card rounded-2xl p-5 sm:p-6 border border-cyan-500/30 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-4">
              <div>
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                  <i data-lucide="plus-circle" class="w-4 h-4 text-cyan-400"></i>
                  <span>Tambah Kunci API Baru ke Vault</span>
                </h3>
                <p class="text-xs text-gray-400">Tambahkan kredensial API untuk mengaktifkan fitur multimedia & model AI pilihan</p>
              </div>

              <!-- Quick Presets -->
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[11px] text-gray-400 font-mono mr-1">Preset:</span>
                <button onclick="applyApiKeyPreset('gemini')" class="px-2.5 py-1 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 text-[11px] font-mono transition">
                  Gemini AI
                </button>
                <button onclick="applyApiKeyPreset('rapidapi')" class="px-2.5 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 text-[11px] font-mono transition">
                  RapidAPI
                </button>
                <button onclick="applyApiKeyPreset('spotify')" class="px-2.5 py-1 rounded-lg bg-teal-500/15 hover:bg-teal-500/25 text-teal-300 border border-teal-500/30 text-[11px] font-mono transition">
                  Spotify
                </button>
                <button onclick="applyApiKeyPreset('youtube')" class="px-2.5 py-1 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-300 border border-red-500/30 text-[11px] font-mono transition">
                  YouTube
                </button>
                <button onclick="applyApiKeyPreset('custom')" class="px-2.5 py-1 rounded-lg bg-blue-500/15 hover:bg-blue-500/25 text-blue-300 border border-blue-500/30 text-[11px] font-mono transition">
                  Custom
                </button>
              </div>
            </div>

            <form onsubmit="saveNewApiKey(event)" class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-gray-300 mb-1.5">Nama / Label Kunci API</label>
                  <input type="text" id="new-key-label" placeholder="Contoh: Primary Gemini 3.5 Pro Key" required class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-300 mb-1.5">Kategori / Penyedia Layanan</label>
                  <select id="new-key-provider" class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-white">
                    <option value="gemini" class="bg-space-950 text-white">Google Gemini AI (Studio)</option>
                    <option value="rapidapi" class="bg-space-950 text-white">RapidAPI Hub (Downloader Engine)</option>
                    <option value="spotify" class="bg-space-950 text-white">Spotify Developer API</option>
                    <option value="youtube" class="bg-space-950 text-white">YouTube Data API v3</option>
                    <option value="custom" class="bg-space-950 text-white">Custom Bearer Token / Webhook</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 flex items-center justify-between">
                  <span>Nilai Kunci Rahasia (API Key / Token):</span>
                  <span class="text-[11px] text-gray-400 font-mono">Terenkripsi & Tersimpan Aman</span>
                </label>
                <div class="relative">
                  <input type="password" id="new-key-val" placeholder="Tempelkan API Key Anda di sini (AIzaSy... / RapidAPI Key)..." required class="glass-input w-full pl-3.5 pr-20 py-2.5 rounded-xl font-mono text-xs text-white" />
                  <button type="button" onclick="toggleKeyVisibility('new-key-val', 'icon-toggle-new-key')" class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-cyan-300 transition">
                    <i data-lucide="eye" id="icon-toggle-new-key" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Deskripsi / Catatan Penggunaan (Opsional)</label>
                <input type="text" id="new-key-desc" placeholder="Contoh: Kunci untuk model analisis kode & produktivitas tim" class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs text-white" />
              </div>

              <!-- Live Test Feedback Box -->
              <div id="key-test-feedback" class="hidden"></div>

              <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" onclick="handleTestNewKeyForm()" class="px-4 py-2.5 glass-panel text-cyan-300 hover:text-white hover:border-cyan-500/40 text-xs font-semibold rounded-xl flex items-center gap-1.5 transition">
                  <i data-lucide="zap" class="w-4 h-4 text-cyan-400"></i>
                  <span>Uji Koneksi (Live Test)</span>
                </button>
                <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 shadow-lg shadow-cyan-500/20 transition">
                  <i data-lucide="check" class="w-4 h-4"></i>
                  <span>Simpan ke Vault</span>
                </button>
              </div>
            </form>
          </div>

          <!-- Section: Daftar Kunci API (Vault List) -->
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i data-lucide="database" class="w-4 h-4 text-cyan-400"></i>
                <span>Daftar Kunci API Tersimpan (${keys.length})</span>
              </h3>
              <span class="text-xs text-gray-400 font-mono">Diurutkan berdasarkan yang terbaru</span>
            </div>

            <div class="grid grid-cols-1 gap-3">
              ${keys.map((keyItem, index) => {
                const isActive = keyItem.status === 'active';
                const isDefault = !!keyItem.isSystemDefault;
                const masked = isDefault 
                  ? 'SERVER_ENV_MANAGED (Sistem Default)'
                  : (keyItem.apiKey.length > 12 
                    ? `${keyItem.apiKey.slice(0, 7)}••••••••${keyItem.apiKey.slice(-5)}` 
                    : '••••••••••••');

                let providerBadgeColor = 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30';
                let providerIcon = 'bot';
                if (keyItem.serviceType === 'rapidapi') {
                  providerBadgeColor = 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
                  providerIcon = 'zap';
                } else if (keyItem.serviceType === 'spotify') {
                  providerBadgeColor = 'bg-teal-500/15 text-teal-300 border-teal-500/30';
                  providerIcon = 'music';
                } else if (keyItem.serviceType === 'youtube') {
                  providerBadgeColor = 'bg-red-500/15 text-red-300 border-red-500/30';
                  providerIcon = 'video';
                } else if (keyItem.serviceType === 'custom') {
                  providerBadgeColor = 'bg-blue-500/15 text-blue-300 border-blue-500/30';
                  providerIcon = 'key';
                }

                return `
                  <div class="p-4 rounded-2xl bg-space-900/80 border ${isActive ? 'border-cyan-500/40 bg-space-900/95' : 'border-white/[0.06]'} flex flex-col md:flex-row md:items-center justify-between gap-4 transition hover:border-cyan-500/50">
                    
                    <div class="flex items-start gap-3.5">
                      <div class="p-2.5 rounded-xl ${providerBadgeColor} border shrink-0 mt-0.5">
                        <i data-lucide="${providerIcon}" class="w-5 h-5"></i>
                      </div>
                      <div class="space-y-1">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-bold text-white">${escapeHtml(keyItem.serviceName)}</span>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-mono uppercase border ${providerBadgeColor}">${keyItem.serviceType}</span>
                          ${isActive 
                            ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> AKTIF</span>` 
                            : `<span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-gray-700/50 text-gray-400 border border-white/10">NONAKTIF</span>`}
                        </div>
                        <p class="text-xs text-gray-400">${escapeHtml(keyItem.description || 'Tidak ada catatan.')}</p>
                        
                        <div class="flex items-center gap-2 pt-1 font-mono text-xs text-cyan-200">
                          <span class="bg-space-950 px-2.5 py-1 rounded-lg border border-white/10 select-all">${masked}</span>
                          ${!isDefault ? `
                            <button onclick="copyToClipboard('${escapeHtml(keyItem.apiKey)}', 'Kunci API disalin!')" title="Salin Kunci Asli" class="p-1 text-gray-400 hover:text-cyan-300 transition">
                              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            </button>
                          ` : ''}
                        </div>
                      </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-2 shrink-0 self-end md:self-center">
                      <button onclick="testExistingKey('${keyItem.id}')" title="Uji Koneksi API" class="px-3 py-1.5 glass-panel text-cyan-300 hover:text-white hover:border-cyan-500/40 text-xs font-semibold rounded-xl flex items-center gap-1.5 transition">
                        <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                        <span>Uji</span>
                      </button>
                      
                      ${!isDefault ? `
                        <button onclick="toggleApiKeyActiveState('${keyItem.id}')" class="px-3 py-1.5 ${isActive ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'} text-xs font-semibold rounded-xl transition">
                          ${isActive ? 'Nonaktifkan' : 'Aktifkan'}
                        </button>
                        <button onclick="deleteApiKeyFromVault('${keyItem.id}')" title="Hapus Kunci dari Vault" class="p-2 glass-panel text-rose-400 hover:text-rose-200 hover:border-rose-500/40 rounded-xl transition">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      ` : `
                        <span class="text-[11px] font-mono text-gray-400 px-2 py-1 bg-space-950 rounded-lg border border-white/5">Default Server</span>
                      `}
                    </div>

                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Section: Panduan Mendapatkan Kunci Resmi -->
          <div class="p-5 rounded-2xl bg-space-900/40 border border-white/[0.06] space-y-3">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider font-mono flex items-center gap-2">
              <i data-lucide="external-link" class="w-4 h-4 text-cyan-400"></i>
              <span>Tautan Resmi Pembuatan Kunci API</span>
            </h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
              <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-space-950/80 border border-cyan-500/20 hover:border-cyan-500/50 text-cyan-300 flex items-center justify-between group transition">
                <span>Google AI Studio Key</span>
                <i data-lucide="arrow-up-right" class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition"></i>
              </a>
              <a href="https://rapidapi.com" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-space-950/80 border border-emerald-500/20 hover:border-emerald-500/50 text-emerald-300 flex items-center justify-between group transition">
                <span>RapidAPI Hub Account</span>
                <i data-lucide="arrow-up-right" class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition"></i>
              </a>
              <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-space-950/80 border border-teal-500/20 hover:border-teal-500/50 text-teal-300 flex items-center justify-between group transition">
                <span>Spotify Developer Portal</span>
                <i data-lucide="arrow-up-right" class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition"></i>
              </a>
              <a href="https://console.cloud.google.com" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-space-950/80 border border-red-500/20 hover:border-red-500/50 text-red-300 flex items-center justify-between group transition">
                <span>Google Cloud Console</span>
                <i data-lucide="arrow-up-right" class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition"></i>
              </a>
            </div>
          </div>

        </div>
      `;

      // Fetch Live Server Telemetry Stats
      fetch('/api/admin/stats')
        .then(res => res.json())
        .then(data => {
          const uptimeElem = document.getElementById('stat-server-uptime');
          const statusElem = document.getElementById('stat-server-status');
          if (uptimeElem && data.uptime !== undefined) {
            const mins = Math.floor(data.uptime / 60);
            const secs = data.uptime % 60;
            const heapMb = data.memoryUsage?.heapUsedMB || 0;
            uptimeElem.innerText = `Uptime: ${mins}m ${secs}s · Heap: ${heapMb}MB · ${data.nodeVersion || 'Node.js'}`;
          }
          if (statusElem && data.status) {
            statusElem.innerHTML = `<span>${data.status.toUpperCase()}</span> <span class="text-xs text-emerald-400 font-mono font-normal">HTTP 200</span>`;
          }
        })
        .catch(e => console.warn('Telemetry notice:', e));

      if (window.lucide) lucide.createIcons();
    }
    function initApp() {
      initStars();
      animateConstellations();
      if (window.updateAdminVisibility) {
        window.updateAdminVisibility(window.currentUserRole === 'admin');
      }
      selectTool('landing');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
