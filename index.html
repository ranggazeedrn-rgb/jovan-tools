    function updateAdminVisibility(isAdmin) {
      const adminTab = document.getElementById('nav-tab-admin');
      const adminTabMd = document.getElementById('nav-tab-admin-md');
      const adminTabM = document.getElementById('m-tab-admin');
      const landingAdminBtn = document.getElementById('landing-admin-btn');

          adminTab.classList.add('flex');

          adminTab.classList.add('hidden');
          adminTab.classList.remove('flex');

      if (user) {
        userRole = 'user';
        const userEmail = (user.email || '').toLowerCase().trim();
        if (userEmail && ADMIN_EMAILS.some(e => e.toLowerCase() === userEmail)) {
          userRole = 'admin';
        }

        // Save/update user profile in Firestore and check Firestore role
        try {
          const userRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userRef);
          if (userSnap.exists()) {
            const data = userSnap.data();
            if (data.role === 'admin') {
              userRole = 'admin';
            } else if (userRole === 'admin') {
              await setDoc(userRef, { role: 'admin' }, { merge: true });
            }
          } else {
            await setDoc(userRef, {
              uid: user.uid,
              email: user.email || '',
              displayName: user.displayName || 'Pengguna',
              photoURL: user.photoURL || '',
              role: userRole,
              createdAt: new Date().toISOString(),
              lastLoginAt: new Date().toISOString()
            }, { merge: true });
          }
        } catch (e) {
          console.warn("Firestore profile sync notice:", e);
        }

        // Trigger reload of user's saved items or chat
        if (window.currentActiveTool === 'gemini') {
          loadUserChatHistoryFromFirestore();
        }
      }

      window.currentUserRole = userRole;
      updateAuthUI(user, userRole);
      updateAdminVisibility(userRole === 'admin');

      // If user logs out or is not admin and is on admin page, redirect to landing
      if (userRole !== 'admin' && window.currentActiveTool === 'admin') {
        selectTool('landing');
      }
    });

    // Google Sign-In Action
    window.handleGoogleSignIn = async function() {
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await signInWithPopup(auth, provider);
        showToast(`Selamat datang, ${result.user.displayName || 'Pengguna'}!`, 'success');
      } catch (error) {
        console.error("Google Sign-In Error:", error);
        showToast('Gagal masuk dengan Google: ' + (error.message || ''), 'error');
      }

    // Sign-Out Action
    window.handleSignOut = async function() {
      try {
        await signOut(auth);
        window.currentUser = null;
        window.currentUserRole = 'guest';
        updateAdminVisibility(false);
        if (window.currentActiveTool === 'admin') {
          selectTool('landing');
        }
        showToast('Berhasil keluar dari akun', 'info');
      } catch (error) {
        showToast('Gagal keluar', 'error');

    function updateAuthUI(user, role) {
      const container = document.getElementById('auth-status-container');
      if (!container) return;

      const currentRole = role || window.currentUserRole || 'user';

        container.innerHTML = `
          <div class="flex items-center gap-2 p-1 pl-2.5 rounded-2xl glass-panel border ${isAdmin ? 'border-amber-500/40' : 'border-cyan-500/30'}">

              <div class="flex items-center gap-1.5 justify-end">
                <span class="text-xs font-bold text-white leading-tight">${escapeHtml(user.displayName || 'User')}</span>
                ${isAdmin ? '<span class="px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 text-[9px] font-mono font-bold border border-amber-500/40">ADMIN</span>' : ''}
              </div>
              <span class="text-[10px] font-mono ${isAdmin ? 'text-amber-300' : 'text-cyan-300'} flex items-center justify-end gap-1">
                <span class="w-1.5 h-1.5 rounded-full ${isAdmin ? 'bg-amber-400' : 'bg-emerald-400'}"></span> ${isAdmin ? 'Admin Authenticated' : 'Cloud Sync'}
              </span>
            </div>
            <img src="${avatar}" alt="Avatar" class="w-8 h-8 rounded-xl object-cover border ${isAdmin ? 'border-amber-500/50' : 'border-cyan-500/40'}" />
            <button onclick="handleSignOut()" title="Keluar Akun" class="p-1.5 text-gray-400 hover:text-rose-400 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>

          </div>
        `;
      } else {
        container.innerHTML = `
          <button onclick="handleGoogleSignIn()" id="btn-login-google" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-semibold flex items-center gap-2 shadow-lg shadow-cyan-500/20 transition">
            <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
            <span>Google Sign-In</span>
          </button>
        `;
      }
      if (window.lucide) lucide.createIcons();
    }

    // Save Chat Message to Firestore
    window.saveChatMessageToFirestore = async function(role, content, model, persona) {
      if (!window.currentUser || !window.fbDb) return;
      try {
        const chatsRef = collection(window.fbDb, "users", window.currentUser.uid, "chats");
        await addDoc(chatsRef, {
          role,
          content,
          model: model || 'gemini-3.5-flash',
          persona: persona || 'general',
          timestamp: new Date().toISOString()
        });
      } catch (err) {
        console.warn("Error saving chat message to Firestore:", err);
      }
    };

    // Load Chat History from Firestore
    window.loadUserChatHistoryFromFirestore = async function() {
      if (!window.currentUser || !window.fbDb) return;
      try {
        const chatsRef = collection(window.fbDb, "users", window.currentUser.uid, "chats");
        const q = query(chatsRef, orderBy("timestamp", "asc"));
        const snapshot = await getDocs(q);
        
        if (!snapshot.empty) {
          const loadedMessages = [];
          snapshot.forEach((doc) => {
            loadedMessages.push(doc.data());
          });
          if (loadedMessages.length > 0) {
            window.chatHistory = loadedMessages.map(m => ({
              role: m.role,
              content: m.content
            }));
            renderChatMessages();
            showToast(`Memuat ${loadedMessages.length} riwayat percakapan dari Cloud`, 'info');
          }
        }
      } catch (err) {
        console.warn("Could not load Firestore chat history:", err);
      }
    };

    // Save Generic Tool History to Firestore (QR, KTP, etc.)
    window.saveItemToFirestore = async function(type, title, data) {
      if (!window.currentUser || !window.fbDb) {
        showToast('Masuk dengan Google untuk menyimpan otomatis ke Firestore', 'info');
        return;
      }
      try {
        const itemsRef = collection(window.fbDb, "users", window.currentUser.uid, "saved_items");
        await addDoc(itemsRef, {
          type,
          title,
          data,
          createdAt: new Date().toISOString()
        });
        showToast(`Tersimpan ke Cloud Firestore (${title})`, 'success');
      } catch (err) {
        console.warn("Error saving to Firestore:", err);
        showToast('Gagal menyimpan ke Cloud', 'error');
      }

    // Save or Update API Key in Firestore
    window.saveApiKeyToFirestore = async function(keyObj) {
      if (!window.currentUser || !window.fbDb) return null;
      try {
        const keyId = keyObj.id || ('key_' + Date.now());
        const keyRef = doc(window.fbDb, "users", window.currentUser.uid, "api_keys", keyId);
        const payload = {
          id: keyId,
          serviceName: keyObj.serviceName || 'Custom API Key',
          serviceType: keyObj.serviceType || 'custom',
          apiKey: keyObj.apiKey || '',
          status: keyObj.status || 'active',
          description: keyObj.description || '',
          createdAt: keyObj.createdAt || new Date().toISOString(),
          lastTestedAt: keyObj.lastTestedAt || new Date().toISOString()
        };
        await setDoc(keyRef, payload, { merge: true });
        return payload;
      } catch (err) {
        console.warn("Error saving API Key to Firestore:", err);
        return null;
      }
    };

    // Load API Keys from Firestore
    window.loadApiKeysFromFirestore = async function() {
      if (!window.currentUser || !window.fbDb) return [];
      try {
        const keysRef = collection(window.fbDb, "users", window.currentUser.uid, "api_keys");
        const snapshot = await getDocs(keysRef);
        const keys = [];
        snapshot.forEach((d) => {
          keys.push(d.data());
        });
        return keys;
      } catch (err) {
        console.warn("Error loading API Keys from Firestore:", err);
        return [];
      }
    };

    // Delete API Key from Firestore
    window.deleteApiKeyFromFirestore = async function(keyId) {
      if (!window.currentUser || !window.fbDb) return false;
      try {
        const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const keyRef = doc(window.fbDb, "users", window.currentUser.uid, "api_keys", keyId);
        await deleteDoc(keyRef);
        return true;
      } catch (err) {
        console.warn("Error deleting API Key from Firestore:", err);
        return false;
      }
    };
  </script>

  <!-- =========================================================================
       APPLICATION LOGIC & CONSTELLATION BACKGROUND
       ========================================================================= -->
  <script>
    /* =========================================================================
       1. CONSTELLATION STARRY BACKGROUND ENGINE
       ========================================================================= */
    const constellationCanvas = document.getElementById('constellation-canvas');
    const ctx = constellationCanvas.getContext('2d');
    let width = constellationCanvas.width = window.innerWidth;
    let height = constellationCanvas.height = window.innerHeight;

    let mouse = { x: null, y: null, radius: 140 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });
    window.addEventListener('resize', () => {
      width = constellationCanvas.width = window.innerWidth;
      height = constellationCanvas.height = window.innerHeight;
      initStars();
    });

    // Star Class
    class Star {
      constructor(x, y, isConstellationStar = false, constellationGroup = '') {
        this.x = x !== undefined ? x : Math.random() * width;
        this.y = y !== undefined ? y : Math.random() * height;
        this.baseX = this.x;
        this.baseY = this.y;
        this.radius = isConstellationStar ? (Math.random() * 1.5 + 2.0) : (Math.random() * 1.4 + 0.6);
        this.alpha = Math.random() * 0.7 + 0.3;
        this.alphaSpeed = (Math.random() * 0.01 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
        this.color = this.getRandomStarColor();
        this.isConstellationStar = isConstellationStar;
        this.constellationGroup = constellationGroup;
      }

      getRandomStarColor() {
        const colors = [
          'rgba(56, 189, 248, ',  // Sky Blue
          'rgba(6, 182, 212, ',   // Cyan
          'rgba(255, 255, 255, ', // Pure White
          'rgba(147, 197, 253, ', // Light Blue
          'rgba(253, 230, 138, '  // Faint Gold
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        // Twinkle
        this.alpha += this.alphaSpeed;
        if (this.alpha > 0.95 || this.alpha < 0.25) {
          this.alphaSpeed = -this.alphaSpeed;
        }

        // Mouse Parallax / Repulsion
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            this.x -= Math.cos(angle) * force * 1.5;
            this.y -= Math.sin(angle) * force * 1.5;
          } else {
            this.x += (this.baseX - this.x) * 0.05;
            this.y += (this.baseY - this.y) * 0.05;
          }
        } else {
          this.x += (this.baseX - this.x) * 0.05;
          this.y += (this.baseY - this.y) * 0.05;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color + this.alpha + ')';
        ctx.shadowBlur = this.isConstellationStar ? 12 : 5;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.7)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Meteor / Shooting Star Class
    class Meteor {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width + 200;
        this.y = -50;
        this.length = Math.random() * 80 + 50;
        this.speed = Math.random() * 8 + 12;
        this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2;
        this.opacity = 1;
        this.active = false;
      }
      spawn() {
        this.reset();
        this.active = true;
      }
      update() {
        if (!this.active) return;
        this.x -= Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.opacity -= 0.015;
        if (this.opacity <= 0 || this.y > height + 100 || this.x < -100) {
          this.active = false;
        }
      }
      draw() {
        if (!this.active) return;
        const tailX = this.x + Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;

        const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        grad.addColorStop(0, `rgba(56, 189, 248, ${this.opacity})`);
        grad.addColorStop(0.3, `rgba(6, 182, 212, ${this.opacity * 0.6})`);
        grad.addColorStop(1, `rgba(255, 255, 255, 0)`);

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    let stars = [];
    let meteors = [new Meteor(), new Meteor(), new Meteor()];
    let constellationLines = [];

    function initStars() {
      stars = [];
      constellationLines = [];

      // 1. Ambient Background Stars
      const starCount = Math.min(Math.floor((width * height) / 8000), 160);
      for (let i = 0; i < starCount; i++) {
        stars.push(new Star());
      }

      // 2. Add Defined Famous Constellation Star Groups (Orion, Ursa Major, Cassiopeia, Crux)
      const orionCenterX = width * 0.22;
      const orionCenterY = height * 0.35;
      const orionPoints = [
        { x: orionCenterX - 45, y: orionCenterY - 70 },
        { x: orionCenterX + 55, y: orionCenterY - 60 },
        { x: orionCenterX - 20, y: orionCenterY },
        { x: orionCenterX, y: orionCenterY },
        { x: orionCenterX + 20, y: orionCenterY },
        { x: orionCenterX - 40, y: orionCenterY + 75 },
        { x: orionCenterX + 50, y: orionCenterY + 70 }
      ];
      const orionStarObjs = orionPoints.map(p => new Star(p.x, p.y, true, 'Orion'));
      stars.push(...orionStarObjs);
      
      constellationLines.push(
        [orionStarObjs[0], orionStarObjs[1]],
        [orionStarObjs[0], orionStarObjs[2]],
        [orionStarObjs[1], orionStarObjs[4]],
        [orionStarObjs[2], orionStarObjs[3]],
        [orionStarObjs[3], orionStarObjs[4]],
        [orionStarObjs[2], orionStarObjs[5]],
        [orionStarObjs[4], orionStarObjs[6]],
        [orionStarObjs[5], orionStarObjs[6]]
      );

      // Ursa Major
      const ursaX = width * 0.78;
      const ursaY = height * 0.28;
      const ursaPoints = [
        { x: ursaX - 70, y: ursaY - 40 },
        { x: ursaX - 45, y: ursaY - 25 },
        { x: ursaX - 20, y: ursaY - 10 },
        { x: ursaX + 10, y: ursaY - 5 },
        { x: ursaX + 15, y: ursaY + 30 },
        { x: ursaX + 55, y: ursaY + 35 },
        { x: ursaX + 50, y: ursaY - 10 }
      ];
      const ursaStarObjs = ursaPoints.map(p => new Star(p.x, p.y, true, 'Ursa Major'));
      stars.push(...ursaStarObjs);

      constellationLines.push(
        [ursaStarObjs[0], ursaStarObjs[1]],
        [ursaStarObjs[1], ursaStarObjs[2]],
        [ursaStarObjs[2], ursaStarObjs[3]],
        [ursaStarObjs[3], ursaStarObjs[4]],
        [ursaStarObjs[4], ursaStarObjs[5]],
        [ursaStarObjs[5], ursaStarObjs[6]],
        [ursaStarObjs[6], ursaStarObjs[3]]
      );

      // Cassiopeia
      const casX = width * 0.5;
      const casY = height * 0.15;
      const casPoints = [
        { x: casX - 60, y: casY - 10 },
        { x: casX - 30, y: casY + 20 },
        { x: casX, y: casY - 15 },
        { x: casX + 30, y: casY + 25 },
        { x: casX + 60, y: casY - 5 }
      ];
      const casStarObjs = casPoints.map(p => new Star(p.x, p.y, true, 'Cassiopeia'));
      stars.push(...casStarObjs);

      constellationLines.push(
        [casStarObjs[0], casStarObjs[1]],
        [casStarObjs[1], casStarObjs[2]],
        [casStarObjs[2], casStarObjs[3]],
        [casStarObjs[3], casStarObjs[4]]
      );

      // Crux
      const cruxX = width * 0.85;
      const cruxY = height * 0.72;
      const cruxPoints = [
        { x: cruxX, y: cruxY - 45 },
        { x: cruxX - 30, y: cruxY + 5 },
        { x: cruxX + 25, y: cruxY + 10 },
        { x: cruxX + 2, y: cruxY + 50 }
      ];
      const cruxStarObjs = cruxPoints.map(p => new Star(p.x, p.y, true, 'Crux'));
      stars.push(...cruxStarObjs);

      constellationLines.push(
        [cruxStarObjs[0], cruxStarObjs[3]],
        [cruxStarObjs[1], cruxStarObjs[2]]
      );
    }

    function animateConstellations() {
      ctx.clearRect(0, 0, width, height);

      // Draw Defined Constellation Connecting Lines
      ctx.lineWidth = 1;
      for (const [s1, s2] of constellationLines) {
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        const lineAlpha = (s1.alpha + s2.alpha) * 0.18;
        ctx.strokeStyle = `rgba(56, 189, 248, ${lineAlpha})`;
        ctx.stroke();
      }

      // Draw Dynamic Proximity Links between nearby stars
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dist = Math.hypot(stars[i].x - stars[j].x, stars[i].y - stars[j].y);
          if (dist < 85) {
            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            const lineAlpha = (1 - dist / 85) * 0.12;
            ctx.strokeStyle = `rgba(6, 182, 212, ${lineAlpha})`;
            ctx.stroke();
          }
        }
      }

      // Draw Mouse Interaction Starlight Lines
      if (mouse.x !== null && mouse.y !== null) {
        for (let i = 0; i < stars.length; i++) {
          const dist = Math.hypot(stars[i].x - mouse.x, stars[i].y - mouse.y);
          if (dist < mouse.radius) {
            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(mouse.x, mouse.y);
            const lineAlpha = (1 - dist / mouse.radius) * 0.25;
            ctx.strokeStyle = `rgba(56, 189, 248, ${lineAlpha})`;
            ctx.stroke();
          }
        }
      }

      // Update & Draw All Stars
      for (const star of stars) {
        star.update();
        star.draw();
      }

      // Occasional Natural Meteor Generation
      if (Math.random() < 0.008) {
        const inactive = meteors.find(m => !m.active);
        if (inactive) inactive.spawn();
      }

      // Update & Draw Meteors
      for (const meteor of meteors) {
        meteor.update();
        meteor.draw();
      }

      requestAnimationFrame(animateConstellations);
    }

    window.triggerMeteorShower = function() {
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const m = new Meteor();
          m.spawn();
          meteors.push(m);
        }, i * 180);
      }
      showToast('Hujan Meteor Rasi Bintang Diluncurkan! 🌠', 'info');
    };

    /* =========================================================================
       2. CORE SYSTEM UTILITIES (TOAST, CLIPBOARD, API KEY VAULT)
       ========================================================================= */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-2xl border text-xs font-medium pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 max-w-sm';

      let iconName = 'info';
      let borderStyle = 'border-cyan-500/40 bg-space-900/90 text-cyan-100 shadow-cyan-500/10';
      let iconColor = 'text-cyan-400';

      if (type === 'success') {
        iconName = 'check-circle-2';
        borderStyle = 'border-emerald-500/50 bg-space-900/95 text-emerald-100 shadow-emerald-500/20';
        iconColor = 'text-emerald-400';
      } else if (type === 'error') {
        iconName = 'alert-octagon';
        borderStyle = 'border-rose-500/50 bg-space-900/95 text-rose-100 shadow-rose-500/20';
        iconColor = 'text-rose-400';
      } else if (type === 'warning') {
        iconName = 'alert-triangle';
        borderStyle = 'border-amber-500/50 bg-space-900/95 text-amber-100 shadow-amber-500/20';
        iconColor = 'text-amber-400';
      }

      toast.className += ` ${borderStyle}`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-4 h-4 shrink-0 ${iconColor}"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message || '')}</span>
        <button onclick="this.parentElement.remove()" class="text-white/60 hover:text-white p-0.5 ml-1">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      `;

      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 3500);
      }, 3500);
    }
    window.showToast = showToast;

    function copyToClipboard(text, customSuccessMsg) {
      if (!text) {
        showToast('Tidak ada data untuk disalin', 'warning');
        return;
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(customSuccessMsg || 'Berhasil disalin ke clipboard!', 'success');
        }).catch(() => fallbackCopyText(text, customSuccessMsg));
      } else {
        fallbackCopyText(text, customSuccessMsg);
      }
    }
    window.copyToClipboard = copyToClipboard;

    function fallbackCopyText(text, customSuccessMsg) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(customSuccessMsg || 'Berhasil disalin ke clipboard!', 'success');
      } catch (err) {
        showToast('Gagal menyalin teks', 'error');
      }
      document.body.removeChild(textArea);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // API Key Storage (RapidAPI)
    function getRapidApiKey() {
      return localStorage.getItem('jovann_rapidapi_key') || '';
    }
    function openApiKeyModal() {
      const modal = document.getElementById('api-modal');
      const input = document.getElementById('rapidapi-key-input');
      const statusBadge = document.getElementById('key-status-badge');
      const key = getRapidApiKey();
      input.value = key;
      if (key) {
        statusBadge.innerText = 'TERPASANG (READY)';
        statusBadge.className = 'text-[10px] font-mono text-emerald-400';
      } else {
        statusBadge.innerText = 'TIDAK TERPASANG';
        statusBadge.className = 'text-[10px] font-mono text-gray-400';
      }
      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }
    function closeApiKeyModal() {
      document.getElementById('api-modal').classList.add('hidden');
    }
    function saveRapidApiKey() {
      const val = document.getElementById('rapidapi-key-input').value.trim();
      if (val) {
        localStorage.setItem('jovann_rapidapi_key', val);
        showToast('RapidAPI Key berhasil disimpan!', 'success');
      } else {
        localStorage.removeItem('jovann_rapidapi_key');
        showToast('RapidAPI Key dikosongkan (Universal Fallback aktif)', 'info');
      }
      closeApiKeyModal();
    }
    function clearRapidApiKey() {
      localStorage.removeItem('jovann_rapidapi_key');
      document.getElementById('rapidapi-key-input').value = '';
      showToast('Kunci API dihapus', 'info');
      closeApiKeyModal();
    }

    /* =========================================================================
       3. NAVIGATION & TOOL ROUTER
       ========================================================================= */
    let currentActiveTool = 'landing';

    function selectTool(toolId) {
      // Security Guard for Admin Tool
      if (toolId === 'admin' && window.currentUserRole !== 'admin') {
        showToast('Akses ditolak: Menu Administrator hanya dapat diakses oleh akun Admin terverifikasi.', 'warning');
        if (currentActiveTool === 'admin') {
          selectTool('landing');
        }
        return;
      }

      currentActiveTool = toolId;
      window.currentActiveTool = toolId;
      const container = document.getElementById('active-tool-container');
      if (!container) return;

      // Trigger Ultra-Smooth Fade-in Animation
      container.classList.remove('tool-fade-in');
      void container.offsetWidth; // Force layout reflow
      container.classList.add('tool-fade-in');

      // Update Desktop and Mobile Tab Styles
      const allToolIds = ['landing', 'photolink', 'gemini', 'yt', 'spotify', 'qr', 'ektp', 'admin'];
      allToolIds.forEach(id => {
        const desktopTab = document.getElementById('nav-tab-' + id);
        const mdTab = document.getElementById('nav-tab-' + id + '-md');
        const mobileTab = document.getElementById('m-tab-' + id);

        if (desktopTab) {
          if (id === toolId) desktopTab.classList.add('tab-active');
          else desktopTab.classList.remove('tab-active');
        }
        if (mdTab) {
          if (id === toolId) mdTab.classList.add('tab-active');
          else mdTab.classList.remove('tab-active');
        }
        if (mobileTab) {
          if (id === toolId) mobileTab.classList.add('tab-active');
          else mobileTab.classList.remove('tab-active');
        }
      });

      // Scroll smoothly to container on mobile if needed
      if (window.innerWidth < 768 && toolId !== 'landing') {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // Render Selected Tool View
      if (toolId === 'landing') renderLandingPage(container);
      else if (toolId === 'photolink') renderPhotoToLinkTool(container);
      else if (toolId === 'gemini') renderGeminiChatTool(container);
      else if (toolId === 'yt') renderYoutubeTool(container);
      else if (toolId === 'spotify') renderSpotifyTool(container);
      else if (toolId === 'qr') renderQrTool(container);
      else if (toolId === 'ektp') renderEktpTool(container);
      else if (toolId === 'admin') renderAdminDashboard(container);

      if (window.lucide) lucide.createIcons();
    }

    // Drag & Drop Setup
    function setupPhotoDropzone() {
      const dropzone = document.getElementById('photo-dropzone');
      if (!dropzone) return;

      ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.add('drag-active');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove('drag-active');
        }, false);
      });

      dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          processPhotoFile(files[0]);
        }
      });
    }

    // Global Clipboard Paste Listener
    document.addEventListener('paste', (e) => {
      if (window.currentActiveTool !== 'photolink') return;
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          if (blob) {
            processPhotoFile(blob);
            showToast('Gambar dari clipboard berhasil dideteksi!', 'success');
            break;
          }
        }
      }
    });

    function handlePhotoFileSelect(e) {
      const files = e.target.files;
      if (files && files.length > 0) {
        processPhotoFile(files[0]);
      }
    }

    async function processPhotoFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('Mohon pilih file gambar yang valid (PNG, JPG, WEBP, GIF, SVG)', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(event) {
        const dataUrl = event.target.result;
        await uploadAndDisplayPhoto(dataUrl, file.name || 'Photo_' + Date.now(), file.type, file.size);
      };
      reader.readAsDataURL(file);
    }

    async function handleConvertFromUrl() {
      const input = document.getElementById('photo-url-input');
      if (!input || !input.value.trim()) {
        showToast('Masukkan URL gambar terlebih dahulu', 'info');
        return;
      }
      const url = input.value.trim();
      showToast('Memproses gambar dari URL...', 'info');

      try {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/png');
          await uploadAndDisplayPhoto(dataUrl, 'URL_Image_' + Date.now(), 'image/png', Math.round(dataUrl.length * 0.75));
          input.value = '';
        };
        img.onerror = function() {
          // Direct fallback if CORS blocked
          uploadAndDisplayPhoto(url, 'External_Image', 'image/jpeg', 0, url);
          input.value = '';
        };
        img.src = url;
      } catch (err) {
        console.warn('URL conversion notice:', err);
        showToast('Gagal memuat URL gambar', 'error');
      }
    }

    async function uploadAndDisplayPhoto(dataUrl, title, mimeType, byteSize, directOverride) {
      showToast('Mengonversi foto ke tautan...', 'info');

      let directUrl = directOverride || '';
      let photoId = 'img_' + Math.random().toString(36).substring(2, 10);
      let formattedSize = byteSize ? (byteSize > 1024 * 1024 ? (byteSize / (1024 * 1024)).toFixed(2) + ' MB' : (byteSize / 1024).toFixed(1) + ' KB') : 'N/A';

      // Send to Backend Upload Endpoint
      if (!directOverride && dataUrl.startsWith('data:')) {
        try {
          const res = await fetch('/api/upload-photo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataUrl, title })
          });
          const json = await res.json();
          if (json.success && json.photo) {
            photoId = json.photo.id;
            directUrl = window.location.origin + json.photo.directUrl;
            formattedSize = json.photo.sizeKB ? json.photo.sizeKB.toFixed(1) + ' KB' : formattedSize;
          } else {
            directUrl = dataUrl; // fallback
          }
        } catch (e) {
          console.warn('Upload API note:', e);
          directUrl = dataUrl;
        }
      }

      if (!directUrl) {
        directUrl = window.location.origin + '/api/i/' + photoId;
      }

      // Calculate Image Dimensions
      const testImg = new Image();
      testImg.onload = function() {
        const width = testImg.naturalWidth || testImg.width || 0;
        const height = testImg.naturalHeight || testImg.height || 0;
        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
        const r = gcd(width, height);
        const aspect = (width && height) ? `${width / r}:${height / r}` : 'N/A';

        // Update UI
        const inspectCard = document.getElementById('photo-inspect-card');
        const previewImg = document.getElementById('photo-preview-img');
        const metaDim = document.getElementById('photo-meta-dimensions');
        const metaSize = document.getElementById('photo-meta-size');
        const metaFormat = document.getElementById('photo-meta-format');
        const metaAspect = document.getElementById('photo-meta-aspect');
        const statusInd = document.getElementById('photo-status-indicator');

        if (inspectCard) inspectCard.classList.remove('hidden');
        if (previewImg) previewImg.src = dataUrl;
        if (metaDim) metaDim.innerText = `${width} × ${height} px`;
        if (metaSize) metaSize.innerText = formattedSize;
        if (metaFormat) metaFormat.innerText = (mimeType || 'image/png').toUpperCase().replace('IMAGE/', '');
        if (metaAspect) metaAspect.innerText = aspect;
        if (statusInd) {
          statusInd.innerText = 'TERHOSTING & AKTIF';
          statusInd.className = 'text-[10px] font-mono text-emerald-400 font-bold';
        }

        // Fill Inputs
        const inDirect = document.getElementById('input-direct-url');
        const inMd = document.getElementById('input-markdown-url');
        const inHtml = document.getElementById('input-html-url');
        const inBb = document.getElementById('input-bbcode-url');

        if (inDirect) inDirect.value = directUrl;
        if (inMd) inMd.value = `![${title}](${directUrl})`;
        if (inHtml) inHtml.value = `<img src="${directUrl}" alt="${title}" />`;
        if (inBb) inBb.value = `[img]${directUrl}[/img]`;

        // Update QR Canvas if open
        const qrBox = document.getElementById('photo-qr-container');
        if (qrBox && !qrBox.classList.contains('hidden')) {
          renderPhotoQrCode(directUrl);
        }

        // Save Photo to History
        const photoRecord = {
          id: photoId,
          title: title || 'Photo',
          directUrl,
          dataUrl: dataUrl.length < 50000 ? dataUrl : '', // Store thumbnail if light
          size: formattedSize,
          dimensions: `${width}×${height}`,
          mimeType: mimeType || 'image/png',
          createdAt: new Date().toLocaleDateString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })
        };

        window.currentUploadedPhoto = photoRecord;
        savePhotoToHistory(photoRecord);
        showToast('Link gambar berhasil digenerate!', 'success');
      };
      testImg.src = dataUrl;
    }

    function togglePhotoQrCode() {
      const qrBox = document.getElementById('photo-qr-container');
      const inDirect = document.getElementById('input-direct-url');
      if (!qrBox || !inDirect || !inDirect.value) {
        showToast('Unggah foto terlebih dahulu untuk melihat QR Code', 'info');

      qrBox.classList.toggle('hidden');
      if (!qrBox.classList.contains('hidden')) {
        renderPhotoQrCode(inDirect.value);
      }

    function renderPhotoQrCode(url) {
      const qrCanvas = document.getElementById('photo-qr-canvas');
      if (!qrCanvas || !window.QRCode) return;
      qrCanvas.innerHTML = '';
      new QRCode(qrCanvas, {
        text: url,
        width: 140,
        height: 140,
        colorDark: "#060911",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function copyToClipboard(elementId, label) {
      const input = document.getElementById(elementId);
      if (!input || !input.value) {
        showToast('Tidak ada tautan untuk disalin', 'info');
        return;
      }
      navigator.clipboard.writeText(input.value).then(() => {
        showToast(`${label} berhasil disalin ke clipboard!`, 'success');
      }).catch(() => {
        input.select();
        document.execCommand('copy');
        showToast(`${label} berhasil disalin!`, 'success');
      });
    }

    // Photo History Store
    function getPhotoHistory() {
      try {
        return JSON.parse(localStorage.getItem('jovann_photo_history')) || [];
      } catch (e) {
        return [];
      }
    }

    function savePhotoToHistory(photo) {
      const list = getPhotoHistory().filter(p => p.id !== photo.id);
      list.unshift(photo);
      if (list.length > 20) list.pop();
      try {
        localStorage.setItem('jovann_photo_history', JSON.stringify(list));
      } catch (e) {
        console.warn('Storage notice:', e);
      }
      renderPhotoHistory();

      // Cloud Firestore Sync if signed in
      if (window.currentUser && window.saveItemToFirestore) {
        window.saveItemToFirestore('photo_link', photo.title, {
          id: photo.id,
          directUrl: photo.directUrl,
          size: photo.size,
          dimensions: photo.dimensions
        });
      }
    }

    window.handleSendMessage = async function(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chat-user-input');
      const sendBtn = document.getElementById('btn-send-chat');
      const message = input?.value.trim();
      if (!message) return;

      // Add user message to history
      window.chatHistory.push({ role: 'user', content: message });
      input.value = '';
      renderChatMessages();

      // Persist user message to Firestore if authenticated
      if (window.saveChatMessageToFirestore) {
        window.saveChatMessageToFirestore('user', message, window.chatSettings.model, window.chatSettings.persona);
      }

      // Add temporary loading indicator
      const thread = document.getElementById('chat-messages-thread');
      const loadingId = 'ai-loading-indicator';
      const loadingElem = document.createElement('div');
      loadingElem.id = loadingId;
      loadingElem.className = 'flex gap-3 items-center text-xs text-cyan-300 font-mono pl-2 py-1';
      loadingElem.innerHTML = `
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-cyan-400"></i>
        <span>Gemini AI sedang menyusun respons (${window.chatSettings.model})...</span>
      `;
      thread.appendChild(loadingElem);
      thread.scrollTop = thread.scrollHeight;
      if (window.lucide) lucide.createIcons();

      if (sendBtn) sendBtn.disabled = true;

      try {
        const customGeminiKey = window.getActiveCustomGeminiKey ? window.getActiveCustomGeminiKey() : '';
        const response = await fetch('/api/gemini/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.chatHistory.map(m => ({ role: m.role, content: m.content })),
            systemInstruction: window.chatSettings.systemInstruction,
            model: window.chatSettings.model,
            customApiKey: customGeminiKey || undefined
          })
        });

        const data = await response.json();
        loadingElem.remove();

        if (response.ok && data.text) {
          window.chatHistory.push({ role: 'model', content: data.text });
          renderChatMessages();

          // Persist model response to Firestore if authenticated
          if (window.saveChatMessageToFirestore) {
            window.saveChatMessageToFirestore('model', data.text, window.chatSettings.model, window.chatSettings.persona);
          }
        } else {
          const errMsg = data.error || 'Gagal memproses respons dari Gemini AI.';
          window.chatHistory.push({
            role: 'model',
            content: `⚠️ **Terjadi Kesalahan**: ${errMsg}\n\nPastikan API Key telah terkonfigurasi di server backend.`
          });
          renderChatMessages();
        }
      } catch (err) {
        loadingElem.remove();
        console.error('Chat error:', err);
        window.chatHistory.push({
          role: 'model',
          content: '⚠️ **Gangguan Jaringan**: Tidak dapat terhubung ke server backend Gemini API.'
        });
        renderChatMessages();
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    };

    window.pasteYtClipboard = async function() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          const input = document.getElementById('yt-url-input');
          if (input) {
            input.value = text.trim();
            showToast('Tautan YouTube ditempel dari clipboard!', 'success');
            processYoutubeMedia();
          }
        }
      } catch (e) {
        showToast('Gunakan tombol Ctrl+V untuk menempelkan tautan', 'info');
      }
    };

    window.setYtUrl = function(url) {
      const input = document.getElementById('yt-url-input');
      if (input) {
        input.value = url;
        processYoutubeMedia();
      }
    };

    window.processYoutubeMedia = async function() {
      const input = document.getElementById('yt-url-input');
      const submitBtn = document.getElementById('yt-btn-submit');
      const url = input?.value.trim();

      if (!url) {
        showToast('Masukkan URL video YouTube terlebih dahulu', 'error');
        return;
      }

      const videoId = extractClientYtId(url);
      if (!videoId) {
        showToast('URL YouTube tidak dikenali. Pastikan memasukkan tautan video yang benar (youtube.com atau youtu.be)', 'error');
        return;
      }

      const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;
      const defaultThumb = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      const maxResThumb = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;

      // Set Loading State on Button
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          <span>Menganalisis Video...</span>
        `;
      }

      showToast('Mengambil data video YouTube...', 'info');

      // Initialize base video object immediately so UI updates right away
      let videoData = {
        videoId: videoId,
        title: `YouTube Video (${videoId})`,
        authorName: 'YouTube Creator',
        cleanUrl: cleanUrl,
        thumbnailUrl: maxResThumb,
        thumbnailHq: defaultThumb,
        embedUrl: `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`
      };

      // 1. Call Backend YouTube Info API
      try {
        const res = await fetch('/api/youtube/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: cleanUrl })
        });
        const json = await res.json();
        if (json.success) {
          videoData = json;
        }
      } catch (err) {
        console.warn('Backend YouTube resolver notice, attempting direct oEmbed fallback:', err);
        // Direct client oEmbed fallback
        try {
          const directRes = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(cleanUrl)}`);
          if (directRes.ok) {
            const d = await directRes.json();
            if (d.title) videoData.title = d.title;
            if (d.author_name) videoData.authorName = d.author_name;
          }
        } catch (e) {
          console.warn('oEmbed direct notice:', e);
        }
      }

      window.currentYtVideo = videoData;
      window.ytIsPlayerActive = false;

      // Update UI with REAL video details
      const resultBox = document.getElementById('yt-result-box');
      const titleEl = document.getElementById('yt-title');
      const channelEl = document.getElementById('yt-channel-name');
      const thumbEl = document.getElementById('yt-thumbnail-img');
      const idBadge = document.getElementById('yt-video-id-badge');
      const linkExternal = document.getElementById('yt-link-external');
      const viewport = document.getElementById('yt-media-viewport');
      const toggleText = document.getElementById('yt-player-toggle-text');

      if (resultBox) resultBox.classList.remove('hidden');
      if (titleEl) titleEl.innerText = videoData.title;
      if (channelEl) channelEl.innerText = videoData.authorName || 'YouTube Creator';
      if (idBadge) idBadge.innerText = `ID: ${videoId}`;
      if (linkExternal) linkExternal.href = cleanUrl;
      if (toggleText) toggleText.innerText = 'Putar di Layar';

      // Restore Viewport to Thumbnail view
      if (viewport) {
        viewport.innerHTML = `
          <img 
            id="yt-thumbnail-img" 
            src="${videoData.thumbnailUrl || maxResThumb}" 
            alt="${escapeHtml(videoData.title)}" 
            class="w-full h-full object-cover group-hover:scale-105 transition duration-500" 
            onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'"
          />
          <div 
            onclick="toggleYtPlayer(true)" 
            class="absolute inset-0 bg-black/40 hover:bg-black/20 backdrop-blur-[1px] flex items-center justify-center cursor-pointer transition"
            title="Putar video di sini"
          >
            <div class="w-12 h-12 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center shadow-xl shadow-red-600/50 hover:scale-110 transition">
              <i data-lucide="play" class="w-6 h-6 ml-0.5 fill-white"></i>
            </div>
          </div>
          <div class="absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded-lg bg-black/80 text-[10px] font-mono font-bold text-white backdrop-blur-sm">
            HD 1080p
          </div>
        `;
      }

      // Update Download Links
      const btnMp4Hd = document.getElementById('yt-btn-mp4-hd');
      const btnMp4Sd = document.getElementById('yt-btn-mp4-sd');
      const btnMp3Hq = document.getElementById('yt-btn-mp3-hq');
      const btnM4a = document.getElementById('yt-btn-m4a');
      const btnMirror1 = document.getElementById('yt-btn-mirror1');
      const btnMirror2 = document.getElementById('yt-btn-mirror2');

      if (btnMp4Hd) btnMp4Hd.href = `https://loader.to/api/button/?url=${encodeURIComponent(cleanUrl)}&f=1080`;
      if (btnMp4Sd) btnMp4Sd.href = `https://loader.to/api/button/?url=${encodeURIComponent(cleanUrl)}&f=480`;
      if (btnMp3Hq) btnMp3Hq.href = `https://loader.to/api/button/?url=${encodeURIComponent(cleanUrl)}&f=mp3`;
      if (btnM4a) btnM4a.href = `https://loader.to/api/button/?url=${encodeURIComponent(cleanUrl)}&f=m4a`;
      if (btnMirror1) btnMirror1.href = `https://y2mate.is/en/?url=${encodeURIComponent(cleanUrl)}`;
      if (btnMirror2) btnMirror2.href = `https://cobalt.tools/`;

      // Save to History
      saveYtHistory(videoData);

      // Reset Submit Button
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Proses Tautan Video</span>
        `;
      }

      showToast(`Video berhasil dimuat: "${videoData.title.slice(0, 35)}..."`, 'success');
      if (window.lucide) lucide.createIcons();
    };

    // YouTube Local History Management
    function getYtHistory() {
      try {
        return JSON.parse(localStorage.getItem('jovann_yt_history')) || [];
      } catch (e) {
        return [];
      }
    }

    function saveYtHistory(video) {
      const list = getYtHistory().filter(v => v.videoId !== video.videoId);
      list.unshift({
        videoId: video.videoId,
        title: video.title,
        authorName: video.authorName || 'YouTube Creator',
        cleanUrl: video.cleanUrl,
        thumbnail: `https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg`,
        savedAt: new Date().toLocaleDateString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })
      });
      if (list.length > 15) list.pop();
      try {
        localStorage.setItem('jovann_yt_history', JSON.stringify(list));
      } catch (e) {}
      renderYtHistory();

      // Sync with Firestore if user signed in
      if (window.currentUser && window.saveItemToFirestore) {
        window.saveItemToFirestore('youtube_download', video.title, {
          videoId: video.videoId,
          cleanUrl: video.cleanUrl,
          authorName: video.authorName
        });
      }
    }

    window.processSpotifyTrack = async function() {
      const input = document.getElementById('spot-url-input');
      const submitBtn = document.getElementById('spot-btn-submit');
      const url = input?.value.trim();
      if (!url) {
        showToast('Masukkan URL track Spotify', 'error');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div><span>Menganalisis...</span>`;
      }

      showToast('Memproses metadata track Spotify...', 'info');
      const resultBox = document.getElementById('spot-result-box');
      if (resultBox) resultBox.classList.remove('hidden');

      let trackData = {
        title: 'Spotify Track',
        artist: 'Spotify Artist',
        thumbnailUrl: '',
        downloadUrl: `https://spotidown.app/?url=${encodeURIComponent(url)}`
      };

      try {
        const res = await fetch('/api/spotify/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const json = await res.json();
        if (json.success) trackData = json;
      } catch (err) {
        console.warn('Spotify info API fallback:', err);
      }

      const titleEl = document.getElementById('spot-title');
      const artistEl = document.getElementById('spot-artist');
      const coverImg = document.getElementById('spot-cover-img');
      const coverFallback = document.getElementById('spot-cover-fallback');
      const dlBtn = document.getElementById('spot-btn-dl');
      const mirrorBtn = document.getElementById('spot-btn-mirror');

      if (titleEl) titleEl.innerText = trackData.title;
      if (artistEl) artistEl.innerText = `Artist: ${trackData.artist} · MP3 320kbps Audio`;
      if (dlBtn) dlBtn.href = trackData.downloadUrl || `https://spotidown.app/?url=${encodeURIComponent(url)}`;
      if (mirrorBtn) mirrorBtn.href = `https://spotifydown.com/?url=${encodeURIComponent(url)}`;

      if (trackData.thumbnailUrl && coverImg && coverFallback) {
        coverImg.src = trackData.thumbnailUrl;
        coverImg.classList.remove('hidden');
        coverFallback.classList.add('hidden');
      }

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i><span>Ambil Detail Track</span>`;
      }

      showToast('Detail Spotify siap diunduh!', 'success');
      if (window.lucide) lucide.createIcons();
    };

    window.generateQrCanvas = function() {
      const target = document.getElementById('qrcode-render-target');
      const text = document.getElementById('qr-content-input')?.value || 'https://jovanntools.app';
      const fgColor = document.getElementById('qr-fg-color')?.value || '#000000';
      const bgColor = document.getElementById('qr-bg-color')?.value || '#ffffff';
      const size = parseInt(document.getElementById('qr-size-select')?.value || '512');

      if (!target) return;
      target.innerHTML = '';

      if (window.QRCode) {
        new QRCode(target, {
          text: text,
          width: Math.min(size, 220),
          height: Math.min(size, 220),
          colorDark: fgColor,
          colorLight: bgColor,
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    };

    window.downloadGeneratedQr = function() {
      const format = document.getElementById('qr-format-select')?.value || 'png';
      const text = document.getElementById('qr-content-input')?.value || 'qr-code';
      const targetImg = document.querySelector('#qrcode-render-target img');
      const targetCanvas = document.querySelector('#qrcode-render-target canvas');

      if (format === 'svg') {
        // Build crisp SVG QR representation
        const size = 512;
        const fgColor = document.getElementById('qr-fg-color')?.value || '#000000';
        const bgColor = document.getElementById('qr-bg-color')?.value || '#ffffff';
        
        let canvas = targetCanvas;
        if (!canvas && targetImg) {
          showToast('Menyiapkan file SVG...', 'info');
        }
        
        const svgContent = `<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <rect width="100%" height="100%" fill="${bgColor}"/>
  <!-- High Resolution QR Vector -->
  <foreignObject width="100%" height="100%">
    <img xmlns="http://www.w3.org/1999/xhtml" src="${targetImg ? targetImg.src : ''}" width="${size}" height="${size}" style="image-rendering: pixelated;"/>
  </foreignObject>
</svg>`;
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `qrcode_${Date.now()}.svg`;
        a.click();
        showToast('QR Code format SVG Vektor berhasil diunduh!', 'success');
        return;
      }

      if (targetCanvas) {
        const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
        const a = document.createElement('a');
        a.href = targetCanvas.toDataURL(mime, 0.95);
        a.download = `qrcode_${Date.now()}.${format}`;
        a.click();
        showToast(`QR Code (${format.toUpperCase()}) berhasil diunduh!`, 'success');
      } else if (targetImg && targetImg.src) {
        const a = document.createElement('a');
        a.href = targetImg.src;
        a.download = `qrcode_${Date.now()}.${format}`;
        a.click();
        showToast(`QR Code (${format.toUpperCase()}) berhasil diunduh!`, 'success');
      } else {
        showToast('Gagal mengunduh QR Code', 'error');
      }
    };

    window.drawEktpCanvas = function() {
      const canvas = document.getElementById('ektp-render-canvas');
      if (!canvas) return;
      const c = canvas.getContext('2d');

      const prov = (document.getElementById('ktp-provinsi')?.value || 'PROVINSI DKI JAKARTA').toUpperCase();
      const kota = (document.getElementById('ktp-kota')?.value || 'JAKARTA SELATAN').toUpperCase();
      const nik = document.getElementById('ktp-nik')?.value || '3174052308980001';
      const nama = (document.getElementById('ktp-nama')?.value || 'JOVANN DEWANTARA').toUpperCase();
      const ttl = (document.getElementById('ktp-ttl')?.value || 'JAKARTA, 23-08-1998').toUpperCase();
      const jk = (document.getElementById('ktp-jk')?.value || 'LAKI-LAKI').toUpperCase();
      const goldar = (document.getElementById('ktp-goldar')?.value || 'O').toUpperCase();
      const alamat = (document.getElementById('ktp-alamat')?.value || 'JL. SUDIRMAN KAV. 52-53').toUpperCase();
      const rtrw = document.getElementById('ktp-rtrw')?.value || '005/002';
      const kel = (document.getElementById('ktp-kel')?.value || 'SENAYAN').toUpperCase();
      const kec = (document.getElementById('ktp-kec')?.value || 'KEBAYORAN BARU').toUpperCase();
      const agama = (document.getElementById('ktp-agama')?.value || 'ISLAM').toUpperCase();
      const status = 'BELUM KAWIN';
      const pekerjaan = (document.getElementById('ktp-pekerjaan')?.value || 'KARYAWAN SWASTA').toUpperCase();
      const warganegara = 'WNI';
      const berlaku = 'SEUMUR HIDUP';

      // 1. Background Gradient Card (Authentic Hologram Cyan-Blue Tone)
      const grad = c.createLinearGradient(0, 0, 700, 440);
      grad.addColorStop(0, '#93c5fd');
      grad.addColorStop(0.35, '#bfdbfe');
      grad.addColorStop(0.7, '#60a5fa');
      grad.addColorStop(1, '#93c5fd');
      c.fillStyle = grad;
      c.fillRect(0, 0, 700, 440);

      // Microprint Guilloche Lines Simulation
      c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      c.lineWidth = 1;
      for (let y = 10; y < 440; y += 12) {
        c.beginPath();
        c.moveTo(0, y);
        c.bezierCurveTo(200, y + 8, 400, y - 8, 700, y);
        c.stroke();
      }

      // 2. Header Text
      c.fillStyle = '#0f172a';
      c.textAlign = 'center';
      c.font = 'bold 19px "Plus Jakarta Sans", sans-serif';
      c.fillText(prov, 350, 32);
      c.font = 'bold 17px "Plus Jakarta Sans", sans-serif';
      c.fillText(kota, 350, 54);

      // 3. NIK Section
      c.textAlign = 'left';
      c.font = 'bold 22px "JetBrains Mono", monospace';
      c.fillText('NIK', 25, 95);
      c.fillText(':', 170, 95);
      c.font = 'bold 23px "JetBrains Mono", monospace';
      c.fillText(nik, 195, 95);

      // 4. Data Fields
      const leftX = 25;
      const colonX = 170;
      const valX = 195;
      let startY = 125;
      const stepY = 22;

      c.font = 'bold 12.5px "Plus Jakarta Sans", sans-serif';
      const fields = [
        { label: 'Nama', val: nama },
        { label: 'Tempat/Tgl Lahir', val: `${ttl}` },
        { label: 'Jenis Kelamin', val: `${jk}           Gol. Darah : ${goldar}` },
        { label: 'Alamat', val: alamat },
        { label: '    RT/RW', val: rtrw },
        { label: '    Kel/Desa', val: kel },
        { label: '    Kecamatan', val: kec },
        { label: 'Agama', val: agama },
        { label: 'Status Perkawinan', val: status },
        { label: 'Pekerjaan', val: pekerjaan },
        { label: 'Kewarganegaraan', val: warganegara },
        { label: 'Berlaku Hingga', val: berlaku },
      ];

      fields.forEach((item, idx) => {
        const y = startY + (idx * stepY);
        c.font = 'bold 12.5px "Plus Jakarta Sans", sans-serif';
        c.fillText(item.label, leftX, y);
        c.fillText(':', colonX, y);
        c.fillText(item.val, valX, y);
      });

      // 5. Photo Box (Right side)
      const photoX = 520;
      const photoY = 85;
      const photoW = 150;
      const photoH = 200;

      if (ektpPhotoData) {
        c.drawImage(ektpPhotoData, photoX, photoY, photoW, photoH);
      } else {
        // Default Red Studio Backdrop + Silhouette
        c.fillStyle = '#dc2626';
        c.fillRect(photoX, photoY, photoW, photoH);
        c.fillStyle = '#f87171';
        c.beginPath();
        c.arc(photoX + photoW/2, photoY + 70, 35, 0, Math.PI * 2);
        c.fill();
        c.beginPath();
        c.arc(photoX + photoW/2, photoY + 180, 60, Math.PI, 0);
        c.fill();
      }
      c.strokeStyle = '#0f172a';
      c.lineWidth = 2;
      c.strokeRect(photoX, photoY, photoW, photoH);

      // Signature Simulation
      c.font = '12px "Plus Jakarta Sans", sans-serif';
      c.textAlign = 'center';
      c.fillText(kota, photoX + photoW/2, 315);
      c.fillText('23-08-2023', photoX + photoW/2, 330);

      c.strokeStyle = '#1e3a8a';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(photoX + 25, 375);
      c.bezierCurveTo(photoX + 50, 340, photoX + 80, 390, photoX + 120, 360);
      c.stroke();
    };

    window.testApiKeyLive = async function(type, key) {
      const testStatusDiv = document.getElementById('key-test-feedback');

        testStatusDiv.classList.remove('hidden');

            <span>Menguji konektivitas API ke server...</span>

      }

      try {
        const res = await fetch('/api/admin/validate-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, key })
        });
        const data = await res.json();
        
        if (testStatusDiv) {
          if (data.valid) {
            testStatusDiv.innerHTML = `
              <div class="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/40 text-emerald-200 text-xs flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                  <span>${escapeHtml(data.message || 'Koneksi Berhasil!')}</span>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">⚡ ${data.latencyMs || 0}ms</span>
              </div>
            `;
          } else {
            testStatusDiv.innerHTML = `
              <div class="p-3 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-200 text-xs flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="alert-octagon" class="w-4 h-4 text-rose-400 shrink-0"></i>
                  <span>${escapeHtml(data.message || 'Validasi Gagal')}</span>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-rose-500/20 text-rose-300 border border-rose-500/40">Error</span>
              </div>
            `;
          }
          if (window.lucide) lucide.createIcons();
        }
        return data;
      } catch (err) {
        if (testStatusDiv) {
          testStatusDiv.innerHTML = `
            <div class="p-3 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-200 text-xs flex items-center gap-2">
              <i data-lucide="alert-octagon" class="w-4 h-4 text-rose-400 shrink-0"></i>
              <span>Gagal menghubungi endpoint validasi: ${escapeHtml(err.message)}</span>
            </div>

          if (window.lucide) lucide.createIcons();
        }

    window.saveNewApiKey = async function(e) {
      if (e) e.preventDefault();
      const label = document.getElementById('new-key-label')?.value.trim() || 'Kunci API Baru';
      const provider = document.getElementById('new-key-provider')?.value || 'gemini';
      const keyVal = document.getElementById('new-key-val')?.value.trim();
      const desc = document.getElementById('new-key-desc')?.value.trim() || '';

      if (!keyVal) {
        showToast('Kunci API tidak boleh kosong!', 'warning');
        return;
      }

      const keyId = 'key_' + Date.now();
      const newKeyObj = {
        id: keyId,
        serviceName: label,
        serviceType: provider,
        apiKey: keyVal,
        status: 'active',
        description: desc,
        createdAt: new Date().toISOString(),
        lastTestedAt: new Date().toISOString(),
        isSystemDefault: false
      };

      // If active Gemini key, deactivate other custom gemini keys so this becomes primary
      const keys = getStoredApiKeys();
      if (provider === 'gemini') {
        keys.forEach(k => {
          if (k.serviceType === 'gemini' && !k.isSystemDefault) {
            k.status = 'inactive';
          }
        });
      }

      keys.unshift(newKeyObj);
      setStoredApiKeys(keys);

      // Persist to Firestore if user logged in
      if (window.saveApiKeyToFirestore) {
        await window.saveApiKeyToFirestore(newKeyObj);
      }

      showToast(`Kunci API "${label}" berhasil disimpan ke Vault!`, 'success');

      // Reset Form & Re-render Dashboard
      const valInput = document.getElementById('new-key-val');
      if (valInput) valInput.value = '';
      const feedback = document.getElementById('key-test-feedback');
      if (feedback) feedback.classList.add('hidden');

      renderAdminDashboard(document.getElementById('active-tool-container'));
    };

    window.toggleApiKeyActiveState = async function(keyId) {
      const keys = getStoredApiKeys();
      const target = keys.find(k => k.id === keyId);
      if (!target) return;

      if (target.isSystemDefault) {
        showToast('Kunci bawaan sistem tidak dapat dinonaktifkan', 'info');
        return;
      }

      const newStatus = target.status === 'active' ? 'inactive' : 'active';

      // If activating a gemini key, deactivate other custom gemini keys
      if (newStatus === 'active' && target.serviceType === 'gemini') {
        keys.forEach(k => {
          if (k.serviceType === 'gemini' && k.id !== keyId && !k.isSystemDefault) {
            k.status = 'inactive';
          }
        });
      }

      target.status = newStatus;
      setStoredApiKeys(keys);

      if (window.saveApiKeyToFirestore) {
        await window.saveApiKeyToFirestore(target);
      }

      showToast(`Status kunci "${target.serviceName}" diubah menjadi: ${newStatus.toUpperCase()}`, 'info');
      renderAdminDashboard(document.getElementById('active-tool-container'));
    };

    window.deleteApiKeyFromVault = async function(keyId) {
      const keys = getStoredApiKeys();
      const target = keys.find(k => k.id === keyId);
      if (!target) return;

      if (target.isSystemDefault) {
        showToast('Kunci bawaan sistem tidak dapat dihapus', 'warning');
        return;
      }

      if (confirm(`Apakah Anda yakin ingin menghapus Kunci API "${target.serviceName}"?`)) {
        const filtered = keys.filter(k => k.id !== keyId);
        setStoredApiKeys(filtered);

        if (window.deleteApiKeyFromFirestore) {
          await window.deleteApiKeyFromFirestore(keyId);
        }

        showToast(`Kunci "${target.serviceName}" berhasil dihapus dari Vault`, 'success');
        renderAdminDashboard(document.getElementById('active-tool-container'));
      }
    };

        keys: keys.filter(k => !k.isSystemDefault)

    window.importApiVaultJson = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && Array.isArray(parsed.keys)) {
            const currentKeys = getStoredApiKeys();
            let addedCount = 0;
            for (const keyItem of parsed.keys) {
              if (keyItem.apiKey && !currentKeys.some(k => k.apiKey === keyItem.apiKey)) {
                currentKeys.unshift({
                  ...keyItem,
                  id: 'key_' + Date.now() + Math.floor(Math.random() * 1000)
                });
                addedCount++;
              }
            }
            setStoredApiKeys(currentKeys);
            showToast(`Berhasil mengimpor ${addedCount} kunci API ke dalam Vault!`, 'success');
            renderAdminDashboard(document.getElementById('active-tool-container'));
          } else {
            showToast('Format berkas cadangan JSON tidak valid', 'error');
          }
        } catch (err) {
          showToast('Gagal membaca berkas JSON: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    };

    window.syncVaultWithFirestore = async function() {
      if (!window.currentUser) {
        showToast('Silakan Masuk dengan Akun Google untuk sinkronisasi Cloud Firestore', 'info');
        return;
      }
      showToast('Menyinkronkan kunci API dengan Cloud Firestore...', 'info');
      try {
        if (window.loadApiKeysFromFirestore) {
          const cloudKeys = await window.loadApiKeysFromFirestore();
          if (cloudKeys && cloudKeys.length > 0) {
            const localKeys = getStoredApiKeys();
            cloudKeys.forEach(ck => {
              const exists = localKeys.find(lk => lk.id === ck.id || (lk.apiKey && lk.apiKey === ck.apiKey));
              if (!exists) {
                localKeys.unshift(ck);
              }
            });
            setStoredApiKeys(localKeys);
            showToast(`Sinkronisasi selesai! ${cloudKeys.length} kunci Cloud dimuat.`, 'success');
            renderAdminDashboard(document.getElementById('active-tool-container'));
          } else {
            showToast('Tidak ada kunci baru di Cloud Firestore', 'info');
          }
        }
      } catch (err) {
        showToast('Gagal sinkronisasi dengan Cloud: ' + err.message, 'error');
      }
    };
